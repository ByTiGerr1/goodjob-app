name: goodjob_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  firebase_auth: ^6.0.1
  cloud_firestore: ^6.0.0
  firebase_core: ^4.0.0
  geolocator: ^14.0.2
  firebase_app_check: '^0.4.1+1'
  flutter_map: ^8.2.1
  latlong2: ^0.9.0
  geocoding: ^4.0.0
  cloud_functions: ^6.0.1
  mockito: ^5.5.1
  firebase_messaging: ^16.0.2
  flutter_local_notifications: ^19.4.2
  device_info_plus: ^12.1.0
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  firebase_storage: ^13.0.2
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  intl: ^0.20.2
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/


flutter_launcher_icons:
      android: "launcher_icon" 
      ios: true
      image_path: "assets/images/GoodJob_con_margen_en_logo_sin_nombre.png" 
      min_sdk_android: 21